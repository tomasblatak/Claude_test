<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <style>
      @keyframes spinIn {
        0% {
          transform: rotate(-180deg) scale(0);
          opacity: 0;
        }
        70% {
          transform: rotate(10deg) scale(1.1);
        }
        100% {
          transform: rotate(0deg) scale(1);
          opacity: 1;
        }
      }

      @keyframes rotateSubtle {
        0%, 100% {
          transform: rotate(-3deg);
        }
        50% {
          transform: rotate(3deg);
        }
      }

      @keyframes boltPulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      .hexagon {
        animation: spinIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                   rotateSubtle 4s ease-in-out 0.8s infinite;
        transform-origin: center;
      }

      .bolt {
        animation: spinIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.15s backwards,
                   boltPulse 2s ease-in-out 1s infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Hexagon background -->
  <g class="hexagon">
    <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5"
             fill="#2563EB"/>
  </g>

  <!-- Lightning bolt -->
  <g class="bolt">
    <path d="M 50 25 L 35 50 L 45 50 L 40 75 L 65 45 L 55 45 L 60 25 Z"
          fill="white"/>
  </g>
</svg>
