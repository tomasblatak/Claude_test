<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <style>
      @keyframes zoomPop {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        50% {
          transform: scale(1.3);
        }
        70% {
          transform: scale(0.9);
        }
        85% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes breathe {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.9;
        }
      }

      @keyframes energize {
        0%, 100% {
          transform: translateY(0) scale(1);
        }
        25% {
          transform: translateY(-2px) scale(1.05);
        }
        75% {
          transform: translateY(2px) scale(0.95);
        }
      }

      .hexagon {
        animation: zoomPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1),
                   breathe 3s ease-in-out 0.7s infinite;
        transform-origin: center;
      }

      .bolt {
        animation: zoomPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s backwards,
                   energize 1.5s ease-in-out 0.8s infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Hexagon background -->
  <g class="hexagon">
    <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5"
             fill="#2563EB"/>
  </g>

  <!-- Lightning bolt -->
  <g class="bolt">
    <path d="M 50 25 L 35 50 L 45 50 L 40 75 L 65 45 L 55 45 L 60 25 Z"
          fill="white"/>
  </g>
</svg>
