<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <style>
      @keyframes bounceIn {
        0% {
          transform: translateY(-100px) scale(0.5);
          opacity: 0;
        }
        60% {
          transform: translateY(10px) scale(1.1);
          opacity: 1;
        }
        80% {
          transform: translateY(-5px) scale(0.95);
        }
        100% {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes glow {
        0%, 100% {
          filter: drop-shadow(0 0 5px rgba(37, 99, 235, 0.5));
        }
        50% {
          filter: drop-shadow(0 0 20px rgba(37, 99, 235, 0.8));
        }
      }

      .logo-group {
        animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                   float 3s ease-in-out 0.8s infinite,
                   glow 2s ease-in-out 0.8s infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <g class="logo-group">
    <!-- Hexagon background -->
    <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5"
             fill="#2563EB"/>

    <!-- Lightning bolt -->
    <path d="M 50 25 L 35 50 L 45 50 L 40 75 L 65 45 L 55 45 L 60 25 Z"
          fill="white"/>
  </g>
</svg>
