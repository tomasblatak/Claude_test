<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <style>
      @keyframes popIn {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes shine {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 0.3;
        }
        100% {
          opacity: 0;
        }
      }

      .hexagon {
        animation: popIn 0.6s ease-out, pulse 2s ease-in-out 0.6s infinite;
        transform-origin: center;
      }

      .bolt {
        animation: popIn 0.6s ease-out 0.2s backwards, pulse 2s ease-in-out 0.8s infinite;
        transform-origin: center;
      }

      .shine {
        animation: shine 2s ease-in-out 0.6s infinite;
      }
    </style>
  </defs>

  <!-- Hexagon background -->
  <g class="hexagon">
    <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5"
             fill="#2563EB"
             stroke="none"/>
  </g>

  <!-- Lightning bolt / feather shape -->
  <g class="bolt">
    <path d="M 50 25 L 35 50 L 45 50 L 40 75 L 65 45 L 55 45 L 60 25 Z"
          fill="white"/>
  </g>

  <!-- Shine effect overlay -->
  <g class="shine">
    <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5"
             fill="white"
             opacity="0"/>
  </g>
</svg>
